# Keeps the Hugging Face Space from sleeping: free CPU Spaces sleep after 48 h without requests.
# Set the repository variable SPACE_URL (Settings -> Secrets and variables -> Actions -> Variables),
# e.g. https://<hf-user>-eg2-navigator.hf.space
name: keep-warm

on:
  schedule:
    - cron: "17 */12 * * *"   # every 12 hours
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    if: ${{ vars.SPACE_URL != '' }}
    steps:
      - name: Ping /health (waits up to 5 min if the Space is waking up)
        run: |
          for i in $(seq 1 30); do
            if curl -fsS --max-time 20 "${{ vars.SPACE_URL }}/health" | grep -q '"status":"ok"'; then
              echo "Space is up"; exit 0
            fi
            echo "attempt $i: not ready yet"; sleep 10
          done
          echo "Space did not respond"; exit 1
